
###############################################################################
# GitHub Actions Workflow – Semantics Validate
###############################################################################

name: Run Semantic / Business Rule

on:
  workflow_dispatch:


jobs:
  semantics-validate:
    name: Semantics Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: unified-branch-network-as-code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load shared env vars
        env:
          ORG_NAME: ${{ vars.ORG_NAME }}
          BRANCH1_MX_SERIAL: ${{ vars.BRANCH1_MX_SERIAL }}
          BRANCH1_MS_SERIAL: ${{ vars.BRANCH1_MS_SERIAL }}
          BRANCH1_CW_SERIAL: ${{ vars.BRANCH1_CW_SERIAL }}
          BRANCH2_MX_SERIAL: ${{ vars.BRANCH2_MX_SERIAL }}
          BRANCH2_MS_SERIAL: ${{ vars.BRANCH2_MS_SERIAL }}
          BRANCH2_CW_SERIAL: ${{ vars.BRANCH2_CW_SERIAL }}
        run: |
          [ -f .env ] && grep -v '^\s*#' .env | grep -v '^\s*$' >> "$GITHUB_ENV" || true
          {
            echo "org_name=$ORG_NAME"
            echo "branch1_mx_serial=$BRANCH1_MX_SERIAL"
            echo "branch1_ms_serial=$BRANCH1_MS_SERIAL"
            echo "branch1_cw_serial=$BRANCH1_CW_SERIAL"
            echo "branch2_mx_serial=$BRANCH2_MX_SERIAL"
            echo "branch2_ms_serial=$BRANCH2_MS_SERIAL"
            echo "branch2_cw_serial=$BRANCH2_CW_SERIAL"
          } >> "$GITHUB_ENV"

      - name: Load NetBox env vars
        run: grep -v '^\s*#' .env.netbox | grep -v '^\s*$' | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install iac-validate
        run: |
          pip install iac-validate
          iac-validate --version

      - name: Run iac-validate
        run: |
          set +e
          iac-validate -r rules data/org_global.nac.yaml --non-strict --verbosity DEBUG 2>&1 | tee iac_validate_output.txt
          exit_code=${PIPESTATUS[0]}

          echo ""
          echo "═══════════════════════════════════════════════════"
          if [ "$exit_code" -eq 0 ]; then
            echo "✅ iac-validate passed – no violations found."
          else
            echo "❌ iac-validate failed (exit code: $exit_code)"
            echo "═══════════════════════════════════════════════════"
            echo ""
            # Surface each ERROR line as a GitHub annotation
            grep '^ERROR' iac_validate_output.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $exit_code

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semantics-validate-output
          path: iac_validate_output.txt
          retention-days: 7
